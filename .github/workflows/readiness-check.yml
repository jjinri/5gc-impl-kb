# readiness-check — generator drift + impl-status + md_table parser guard.
#
# PR-15 (D5 in Pane 2 final-goal sequence, 2026-05-26). Plan §7 Phase C
# drift guard 설치.
#
# PR-16 — CI-safe contract materialization chain 추가 + nf-impl-status
# --no-write step 복원 (Pane 2 #65 follow-up).
#
# Triggers — readiness-relevant tree 변경 시.
#
# Scope:
# - md_table unit test (lib regression).
# - contract materialization (specs/ + tracked scripts → handoff/contract.yaml).
# - generator --check (6 target drift).
# - nf-impl-status --no-write (validator gate).
# 전체 pytest tests/scripts/ 는 ~2 분이라 본 workflow 에서는 제외.

name: readiness-check

on:
  pull_request:
    paths:
      - 'design/**'
      - 'dev/**'
      - 'engineering/**'
      - 'tests/scripts/test_md_table.py'
      - 'tests/scripts/test_nf_manifest_overrides.py'
      - '.github/workflows/readiness-check.yml'
  push:
    branches:
      - main
    paths:
      - 'design/**'
      - 'dev/**'
      - 'engineering/**'
      - 'tests/scripts/test_md_table.py'
      - 'tests/scripts/test_nf_manifest_overrides.py'
      - '.github/workflows/readiness-check.yml'

jobs:
  readiness-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: md_table + nf-manifest overrides unit tests
        run: |
          python3 -m pytest tests/scripts/test_md_table.py \
            tests/scripts/test_nf_manifest_overrides.py -q

      # CI-safe contract materialization chain — tracked specs/ + policy-
      # derived manual_overrides (PR-16) → ready_for_build=true 자동 진입.
      - name: nf-manifest (refresh from tracked specs)
        run: python3 design/scripts/nf-manifest.py nssf --primary 29.531 --write

      - name: nf-seed-gen (handoff seed)
        run: python3 design/scripts/nf-seed-gen.py nssf

      - name: materialize-contract (topics)
        run: python3 design/scripts/materialize-contract.py nssf --force

      - name: build-handoff (contract.yaml)
        run: python3 design/scripts/build-handoff.py nssf

      - name: nf-readiness-pack-generate --check (drift guard)
        run: python3 design/scripts/nf-readiness-pack-generate.py nssf --check

      - name: nf-impl-status --no-write (validator gate)
        run: python3 design/scripts/nf-impl-status.py nssf --no-write
