# readiness-check — generator drift + validator + md_table parser guard.
#
# PR-15 (D5 in Pane 2 final-goal sequence, 2026-05-26). Plan §7 Phase C
# drift guard 설치.
#
# Triggers — readiness-relevant tree 변경 시. tests 변경도 포함 (lib
# regression 방지).
#
# Scope: 가볍게 유지 — 6 generator target --check + impl-status + md_table
# unit test 만. 전체 pytest tests/scripts/ 는 ~2 분이라 본 workflow 에서는
# 제외, 별도 CI workflow 가 필요할 때 추가.

name: readiness-check

on:
  pull_request:
    paths:
      - 'design/**'
      - 'dev/**'
      - 'engineering/**'
      - 'tests/scripts/test_md_table.py'
      - '.github/workflows/readiness-check.yml'
  push:
    branches:
      - main
    paths:
      - 'design/**'
      - 'dev/**'
      - 'engineering/**'
      - 'tests/scripts/test_md_table.py'
      - '.github/workflows/readiness-check.yml'

jobs:
  readiness-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: md_table parser unit tests
        run: python3 -m pytest tests/scripts/test_md_table.py -q

      - name: nf-readiness-pack-generate --check (drift guard)
        run: python3 design/scripts/nf-readiness-pack-generate.py nssf --check

      - name: nf-impl-status --no-write (validator gate)
        run: python3 design/scripts/nf-impl-status.py nssf --no-write
