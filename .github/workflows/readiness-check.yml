# readiness-check — generator drift + impl-status + pytest guard.
#
# Triggers — readiness-relevant tree 변경 시. 본 workflow 의 scope:
# - 전체 pytest tests/ (md_table·manifest-overrides·build-handoff·readiness
#   resolve·registry bootstrap 등 92+건. local ~12s, CI < 1m 범위).
# - contract materialization chain (specs/ + tracked scripts → handoff/
#   contract.yaml).
# - generator --check (drift guard).
# - nf-impl-status --no-write (validator gate).
#
# paths 정책 — 본 workflow 의 step 이 실제 검증하는 경로만. design/dev/
# engineering 산출 + tests/ 전체 + .claude/skills (lifecycle/script 정합
# 입력) + 본 workflow 자체. docs/adr/**, README/CLAUDE/CONTEXT 등 prose 만
# 의 변경은 CI 검증 대상 외 (의도적 제외).

name: readiness-check

on:
  pull_request:
    paths:
      - 'design/**'
      - 'dev/**'
      - 'engineering/**'
      - 'tests/**'
      - '.claude/skills/**'
      - '.github/workflows/readiness-check.yml'
  push:
    branches:
      - main
    paths:
      - 'design/**'
      - 'dev/**'
      - 'engineering/**'
      - 'tests/**'
      - '.claude/skills/**'
      - '.github/workflows/readiness-check.yml'

jobs:
  readiness-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: pytest tests/ (full unit + integration suite)
        run: python3 -m pytest tests/ -q

      # CI-safe contract materialization chain — tracked specs/ + policy-
      # derived manual_overrides (PR-16) → ready_for_build=true 자동 진입.
      - name: nf-manifest (refresh from tracked specs)
        run: python3 design/scripts/nf-manifest.py nssf --primary 29.531 --write

      - name: nf-seed-gen (handoff seed)
        run: python3 design/scripts/nf-seed-gen.py nssf

      - name: materialize-contract (topics)
        run: python3 design/scripts/materialize-contract.py nssf --force

      - name: build-handoff (contract.yaml)
        run: python3 design/scripts/build-handoff.py nssf

      - name: nf-readiness-pack-generate --check (drift guard)
        run: python3 design/scripts/nf-readiness-pack-generate.py nssf --check

      - name: nf-impl-status --no-write (validator gate)
        run: python3 design/scripts/nf-impl-status.py nssf --no-write

      - name: validate-artifact-catalog (drift guard for docs/lifecycle-artifacts.md §3)
        run: python3 design/scripts/validate-artifact-catalog.py
