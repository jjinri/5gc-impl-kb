# ─── 8. Cross-cutting CI gates ────────────────────────────────────────
# 본 섹션은 codegen-work-items.yaml 의 개별 WI 가 아니라 readiness pack
# transversal 검사. CI workflow (readiness-check.yml) 의 step 매핑.
ci_pipeline:
  workflow: .github/workflows/readiness-check.yml
  steps:
    - name: pytest tests/ (full unit + integration suite)
      check_id: pytest_full_suite
    - name: nf-manifest (refresh from tracked specs)
      check_id: nf_manifest_refresh
      command: 'python3 design/scripts/nf-manifest.py nssf --primary 29.531 --write'
      proves: manifest 가 tracked specs 와 정합
    - name: nf-seed-gen (handoff seed)
      check_id: nf_seed_gen
      command: 'python3 design/scripts/nf-seed-gen.py nssf'
      proves: contract seed 갱신 deterministic
    - name: materialize-contract (topics)
      check_id: materialize_contract
      command: 'python3 design/scripts/materialize-contract.py nssf --force'
      proves: contract topic md 산출 deterministic
    - name: build-handoff (contract.yaml)
      check_id: build_handoff
      command: 'python3 design/scripts/build-handoff.py nssf'
      proves: handoff/nssf/contract.yaml 가 design source 와 정합
    - name: nf-readiness-pack-generate --check (drift guard)
      check_id: nf_readiness_pack_generate_check
    - name: nf-impl-status --no-write (validator gate)
      check_id: nf_impl_status
    - name: validate-artifact-catalog (drift guard for docs/lifecycle-artifacts.md §3)
      check_id: validate_artifact_catalog
    - name: Install CMake + build-essential
      check_id: ci_cmake_install
      command: 'sudo apt-get install -y cmake build-essential'
      proves: CI runner 에 build prerequisite 설치
    - name: CMake configure (Unix Makefiles, Debug, sanitizers ON)
      check_id: phase1_wave0_cmake_configure
    - name: CMake build
      check_id: phase1_wave0_cmake_build
    - name: ctest (Phase 1 tracer-bullet smoke)
      check_id: phase1_wave0_ctest_smoke
