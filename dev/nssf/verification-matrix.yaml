    run_in_ci: false

  - id: phase1_wave1_contract_nsselection_response_schema
    command: 'ctest --test-dir build -R nssf_nsselection_response_schema'
    proves: handoff contract.yaml 의 NSSelectionGet response schema 와 byte-level 일치
    phase: phase1_wave1
