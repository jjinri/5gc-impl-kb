# NSSF Verification Matrix — check id 카탈로그
#
# autonomous agent 가 phase exit 시 *어떤 명령으로 무엇을 증명* 하는지를
# 명시적으로 정의한다. agent-execution-plan.yaml 의 phases[].required_checks
# 는 본 yaml 의 checks[].id 를 참조한다.
#
# 본 파일은 dev/nssf/verification-plan.md (사람 산문 + AUTO Unit/Integration/
# Contract/E2E/Observability sub-section) 의 *기계 표현* 이다. verification-
# plan.md AUTO 가 갱신되면 본 yaml 도 같이 갱신.
schema_version: verification-matrix-v1
nf: nssf
stage: implementation-planning
source_verification_plan: dev/nssf/verification-plan.md
source_codegen_work_items: dev/nssf/codegen-work-items.yaml
source_agent_execution_plan: dev/nssf/agent-execution-plan.yaml
generated_date: 2026-05-27

# ─── 1. Project-wide checks (모든 phase 진입/종료 시 의무) ─────────────
checks:
  - id: pytest_full_suite
    command: '.venv/bin/python3 -m pytest tests/ -q'
    proves: design/scripts validator + lifecycle script suite 회귀 없음
    phase: ALL
    work_item: ALL
    required: true
    pass_criteria: 'exit 0 + stdout "<N> passed" — 현재 baseline 94 passed'
    run_in_ci: true
    ci_step_name: 'pytest tests/ (full unit + integration suite)'

  - id: validate_artifact_catalog
    command: '.venv/bin/python3 design/scripts/validate-artifact-catalog.py'
    proves: 'docs/lifecycle-artifacts.md §3 ↔ repo 산출 drift 없음'
    phase: ALL
    work_item: ALL
    required: true
    pass_criteria: 'exit 0 + "PASS N FAIL 0" stdout'
    run_in_ci: true
    ci_step_name: 'validate-artifact-catalog (drift guard for docs/lifecycle-artifacts.md §3)'

  - id: nf_readiness_pack_ready
    command: '.venv/bin/python3 design/scripts/nf-readiness-status.py nssf --no-write'
    proves: aggregate gate readiness_pack_ready PASS (handoff_ready + contract_implementable + arch_consistent + impl_ready_for_codegen + eng_frozen)
    phase: phase0_readiness_gate
    work_item: ALL
    required: true
    pass_criteria: 'gates.readiness_pack_ready.status == PASS + blocked_by == []'
    run_in_ci: false   # gitignored upstream status 가 fresh-clone 에 부재. /nf-readiness 가 선행 필요.

  - id: nf_impl_status
    command: '.venv/bin/python3 design/scripts/nf-impl-status.py nssf --no-write'
    proves: impl_consistent + impl_ready_for_codegen PASS (WI graph self-consistent, 20 checks)
    phase: phase0_readiness_gate
    work_item: ALL
    required: true
    pass_criteria: 'gate impl_consistent PASS + gate impl_ready_for_codegen PASS'
    run_in_ci: true
    ci_step_name: 'nf-impl-status --no-write (validator gate)'

  - id: nf_eng_status
    command: '.venv/bin/python3 design/scripts/nf-eng-status.py nssf --no-write'
    proves: 'eng_frozen PASS (engineering-design.md 13 core slot + per-NF 연기 register 결정 freeze)'
    phase: phase0_readiness_gate
    work_item: ALL
    required: true
    pass_criteria: 'gates.eng_frozen.status == PASS'
    run_in_ci: false
    notes: 'engineering-design 변경 시 freeze 재검증. PR-library-stack-decision-pass 의 required check.'

  - id: execution_control_drift
    command: '.venv/bin/python3 design/scripts/validate-execution-control-drift.py nssf'
    proves: 'agent-execution-plan / team-execution-plan / verification-matrix / codegen-work-items / pr-slicing-plan / readiness-config 사이 id / reference 일관성'
    phase: ALL
    work_item: ALL
    required: true
    pass_criteria: 'exit 0 + stderr 의 모든 section PASS'
    run_in_ci: true
    ci_step_name: 'validate-execution-control-drift (drift guard for execution-control pack)'

  - id: nf_readiness_pack_generate_check
    command: '.venv/bin/python3 design/scripts/nf-readiness-pack-generate.py nssf --check'
    proves: 'readiness pack AUTO 섹션 drift 없음 (config-driven render PASS)'
    phase: ALL
    work_item: ALL
    required: true
    pass_criteria: '6/6 PASS (traceability, implementation-plan, test-matrix, team-execution-plan, open-gaps, verification-plan)'
    run_in_ci: true
    ci_step_name: 'nf-readiness-pack-generate --check (drift guard)'

# ─── 2. Phase 1 wave 0 (tracer-bullet toolchain) ──────────────────────
  - id: phase1_wave0_cmake_configure
    command: 'cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Debug'
    proves: CMake configure 성공 + Unix Makefiles generator + Debug build type
    phase: phase1_wave0
    work_item: WI-tracer-bullet-toolchain
    required: true
    pass_criteria: 'exit 0 + stdout "Build files have been written"'
    run_in_ci: true
    ci_step_name: 'CMake configure (Unix Makefiles, Debug, sanitizers ON)'

  - id: phase1_wave0_cmake_build
    command: 'cmake --build build --parallel'
    proves: ASan/UBSan 활성 빌드 성공, -Wall -Wextra -Werror clean (handwritten code)
    phase: phase1_wave0
    work_item: WI-tracer-bullet-toolchain
    required: true
    pass_criteria: 'exit 0 + nssf_transport + unity + test_nsselection_handler targets built'
    run_in_ci: true
    ci_step_name: 'CMake build'

  - id: phase1_wave0_ctest_smoke
    command: 'ctest --test-dir build --output-on-failure'
    proves: nsselection_handler_smoke 5 assertion PASS, ASan/UBSan leak/UB 0
    phase: phase1_wave0
    work_item: WI-tracer-bullet-toolchain
    required: true
    pass_criteria: '"100% tests passed, 0 tests failed out of 1"'
    run_in_ci: true
    ci_step_name: 'ctest (Phase 1 tracer-bullet smoke)'

# ─── 3. Phase 1 wave 1 (NSSelectionGet full feature wiring) ───────────
  - id: phase1_wave1_codegen_drift_check
    command: 'cmake --build build --target nssf_generated'
    proves: WI-codegen-bootstrap openapi-generator 산출이 contract data-model 과 drift 없음 (Phase 3 진입 시점 활성)
    phase: phase1_wave1
    work_item: WI-codegen-bootstrap
    required: true
    pass_criteria: 'exit 0 + 14 contract data-model schema + TS29571 external dep emit'
    run_in_ci: false   # WI-codegen-bootstrap 실 진입 후 활성
    notes: 'WI-codegen-bootstrap PR (phase 1 wave 1 시작) 머지 시점에 CI step 추가 예정.'

  - id: phase1_wave1_unit_tests_all_pass
    command: 'ctest --test-dir build -R "^nssf_(generated_|schema_|tls_|oauth2_|problem_details_|nftype_|availability_repo_|selection_engine_)"'
    proves: wave 1 의 7 WI 의 unit test 모두 PASS
    phase: phase1_wave1
    work_item:
      - WI-codegen-bootstrap
      - WI-schema-bootstrap
      - WI-tls-bootstrap
      - WI-problem-details-wrapper
      - WI-nftype-wrapper
      - WI-availability-repo
      - WI-selection-engine
    required: true
    pass_criteria: '모든 매칭 test PASS'
    run_in_ci: false

  - id: phase1_wave1_integration_nsselection_get_happy
    command: 'ctest --test-dir build -R nssf_nsselection_.*_happy'
    proves: NSSelectionGet golden path 200 (AuthorizedNetworkSliceInfo)
    phase: phase1_wave1
    work_item: WI-nsselection-handler
    required: true
    pass_criteria: 'PASS'
    run_in_ci: false

  - id: phase1_wave1_integration_nsselection_get_errors
    command: 'ctest --test-dir build -R nssf_nsselection_.*_errors'
    proves: NSSelectionGet error path 403 / 404 / 414 / 500 정확 응답
    phase: phase1_wave1
