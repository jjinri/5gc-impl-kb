      - src/nssf/handlers/CMakeLists.txt
      - src/nssf/server/router.{h,c} (nghttp2 route 등록)
      - src/nssf/server/CMakeLists.txt
      - src/nssf/main.c (process bootstrap)
      - src/nssf/CMakeLists.txt (root)
    acceptance:
      - "`nssf_nsselection_get_handler` 가 GET /network-slice-information 라우트 처리."
      - TLS / OAuth2 scope `nnssf-nsselection` 검증을 handler 진입 전에 통과.
      - 200 (AuthorizedNetworkSliceInfo) / 403 / 404 / 414 / 500 응답 정확.
      - HTTP 응답 schema 가 generated struct serializer 산출과 일치.
    tests:
      - tests/nssf/integration/test_nsselection_get_happy.c — PostgreSQL fixture + nghttp2 client probe 로 200 검증
      - tests/nssf/integration/test_nsselection_get_errors.c — 403 (scope miss), 404 (no availability), 414 (uri too long), 500 (db down)
      - tests/nssf/contract/test_nsselection_response_schema.c — handoff contract.yaml 의 NSSelectionGet response schema 와 byte-level 일치
    verification_commands:
      - cmake --build build --target nssf
      - ctest --test-dir build -R nssf_nsselection_

  # ===== Phase 2 wave A (NSSAIAvailability writes, PR G 후속) =====
  - id: WI-availability-engine
    owner_lane: code
    depends_on:
      - WI-availability-repo
      - WI-problem-details-wrapper
    inputs:
      - design/nssf/module-decomposition/AvailabilityEngine.md
      - api-implementation-matrix.md (NSSAIAvailability Put/Patch/Delete row)
      - open-gaps-and-assumptions.md G-04 (PatchDocument RFC 6902 confirmed), G-11 (amfSetReallocationInd default)
    expected_files:
      - src/nssf/engine/availability_engine.{h,c} (replace, patch, delete, options 4 entry)
    acceptance:
      - "`replace()` — full-replace semantics, AMF reallocation flag, snssai dedup."
      - "`patch()` — RFC 6902 JSON Patch (op/path/value(/from) per 29.531 §6.1.6 + TS29571 PatchItem), atomic apply, 415 reject on non-application/json-patch+json content-type."
