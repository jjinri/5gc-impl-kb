  - id: WI-contract-tests
    owner_lane: tester
    depends_on:
      - WI-nsselection-handler
      - WI-availability-handlers
      - WI-subscription-handlers
    inputs:
      - handoff/nssf/contract.yaml
      - verification-plan.md ## Contract
    expected_files:
      - tests/nssf/contract/test_handoff_contract_alignment.c
      - tests/nssf/contract/test_error_matrix.c
    acceptance:
      - handoff contract.yaml 의 모든 8 op × cause matrix 실행.
      - response schema 가 generated struct serializer 와 byte-level 일치.
    tests:
      - tests/nssf/contract/test_handoff_contract_alignment.c
      - tests/nssf/contract/test_error_matrix.c
    verification_commands:
      - ctest --test-dir build -R nssf_contract_

  - id: WI-security-tests
    owner_lane: verifier
    depends_on:
      - WI-tls-bootstrap
      - WI-nsselection-handler
    inputs:
      - docs/adr/ADR-0004-project-security-baseline.md (7 항목)
      - verification-plan.md ## Security
    expected_files:
      - tests/nssf/security/test_tls_baseline.c
      - tests/nssf/security/test_oauth2_inbound.c
      - tests/nssf/security/test_oauth2_outbound.c
      - tests/nssf/security/test_security_dev_disable.c
    acceptance:
      - ADR-0004 7 항목 각각 verification command + evidence emit.
      - mocked peer cert / mocked JWKS server fixture 로 fail-closed 검증.
    tests:
      - tests/nssf/security/test_tls_baseline.c
      - tests/nssf/security/test_oauth2_inbound.c
      - tests/nssf/security/test_oauth2_outbound.c
    verification_commands:
      - ctest --test-dir build -R nssf_security_

  - id: WI-e2e-tests
    owner_lane: verifier
    depends_on:
      - WI-contract-tests
      - WI-security-tests
    inputs:
      - design/nssf/architecture/request-flow.md (핵심 시나리오)
      - verification-plan.md ## End-to-End
    expected_files:
      - tests/nssf/e2e/test_amf_register_nsselect.c (UE 등록 → NSSelectionGet 시나리오)
      - tests/nssf/e2e/test_availability_subscription_notify.c
    acceptance:
      - end-to-end 시나리오 green (mocked AMF peer).
      - retry_queue 동기 dispatch + 1회 재시도 시나리오 cover.
    tests:
      - tests/nssf/e2e/test_amf_register_nsselect.c
      - tests/nssf/e2e/test_availability_subscription_notify.c
    verification_commands:
      - ctest --test-dir build -R nssf_e2e_

  # ===== Phase 5 (hardening, PR G 후속) =====
  - id: WI-observability-finalize
    owner_lane: code
    depends_on:
      - WI-nsselection-handler
      - WI-availability-handlers
      - WI-subscription-handlers
    inputs:
      - design/nssf/architecture/observability.md
      - open-gaps-and-assumptions.md G-14 (dashboard/alert tuning deferred)
    expected_files:
      - src/nssf/observability/metrics.{h,c}
      - src/nssf/observability/log.{h,c}
      - src/nssf/observability/trace.{h,c}
      - src/nssf/observability/CMakeLists.txt
    acceptance:
      - metric/log/trace seam 가 architecture observability.md 의 모든 항목 emit.
      - prod-ready signal (label cardinality, log level, trace sampler) freeze.
    tests:
      - tests/nssf/unit/test_observability_metrics.c
      - tests/nssf/unit/test_observability_log.c
      - tests/nssf/unit/test_observability_trace.c
    verification_commands:
