      - tests/nssf/unit/test_selection_engine_pdu.c — pdu session payload
      - tests/nssf/unit/test_selection_engine_ueconfig.c — UE configuration update payload
      - tests/nssf/unit/test_selection_engine_redirect.c — redirect config 부재/존재
    verification_commands:
      - ctest --test-dir build -R nssf_selection_engine_

  - id: WI-nsselection-handler
    owner_lane: code
    depends_on:
      - WI-selection-engine
      - WI-tls-bootstrap
      - WI-problem-details-wrapper
    inputs:
