schema_version: codegen-work-items-v1
nf: nssf
stage: implementation-planning
status: draft
source_architecture: design/nssf/architecture
source_contract: handoff/nssf/contract.yaml
generated_date: 2026-05-22

# Cross-references (execution-control pack — PR-execution-control-pack).
# 본 yaml 의 WI 가 phase / lane / verification / PR 단위로 어떻게 묶이는지는
# 아래 4 파일에서 확정된다.
cross_references:
  agent_execution_plan: dev/nssf/agent-execution-plan.yaml   # phase / lane / no-spec-reread / checkpoint
  verification_matrix: dev/nssf/verification-matrix.yaml     # check id 카탈로그
  pr_slicing_plan: dev/nssf/pr-slicing-plan.yaml             # PR 단위 분할
  team_execution_plan: dev/nssf/team-execution-plan.md       # lane H2 사람 산문

# items[] — file-level autonomous codegen work units.
# 각 item 필수 키 — id, owner_lane, depends_on, inputs, expected_files,
#                   acceptance, tests, verification_commands.
# `impl_ready_for_codegen` gate 의 다음 check 가 이 schema 를 본다.
#   - all_work_items_have_expected_files  (expected_files 비어있지 않음)
#   - all_work_items_have_tests           (tests 비어있지 않음)
#   - all_work_items_have_verification_commands (verification_commands 비어있지 않음)

items:
  # ===== Phase 1 wave 0 (tracer-bullet toolchain skeleton, PR #87) =====
  - id: WI-tracer-bullet-toolchain
    owner_lane: code
    depends_on: []
    inputs:
      - engineering/nssf/engineering-design.md (build_system=CMake, language=C11, test=Unity, sanitizer=ASan/UBSan slots)
      - docs/sessions/2026-05-27-handoff.md §3.2 (Phase 1 file layout)
      - dev/nssf/team-execution-plan.md (lane H2 — code lane 산출 위치)
    expected_files:
      - "CMakeLists.txt (root — cmake_minimum_required VERSION 3.22, CMAKE_C_STANDARD 11, nssf_sanitizers INTERFACE ASan+UBSan with NSSF_ENABLE_SANITIZERS option, nssf_warnings INTERFACE -Wall -Wextra -Werror, enable_testing, CMAKE_EXPORT_COMPILE_COMMANDS ON)"
      - "src/nssf/CMakeLists.txt (nssf_transport static library target)"
      - "src/nssf/transport/nsselection_handler.{h,c} (501 ProblemDetails hardcoded JSON stub — cJSON encoding deferred to WI-codegen-bootstrap)"
      - "src/nssf/generated/api/NSSelectionGet.h (hand-written generator boundary stub with NSSF_GENERATED_BOUNDARY_STUB marker — replace during WI-codegen-bootstrap)"
      - "tests/nssf/CMakeLists.txt (Unity static target + test executable + add_test)"
      - "tests/nssf/vendor/Unity/{unity.h,unity.c,unity_internals.h,LICENSE.txt} (Unity 2.6.0 vendored, MIT, -w warning 제외)"
      - "tests/nssf/unit/test_nsselection_handler.c (5 smoke assertions — status 501, body contains type/status/detail, NULL body safe)"
      - ".github/workflows/readiness-check.yml (paths 에 src/** + CMakeLists.txt 추가, cmake configure/build/ctest 4-step CI)"
      - ".gitignore (/build/, compile_commands.json 추가)"
      - "dev/nssf/_implementation_run_state.yaml (gitignored evidence — tracer_bullet_passed true, completed_phases 1, spec_reread_audit empty)"
    acceptance:
      - "본 WI 는 SKILL.md /nf-implement Phase 1 (가장 작은 vertical slice) 정의의 NSSF 산출 — readiness-config phase_policy 의 phase1 wave 0 으로 grouping."
      - "cmake -S . -B build -G Unix Makefiles -DCMAKE_BUILD_TYPE=Debug — configure OK."
      - "cmake --build build --parallel — ASan/UBSan 활성 빌드 OK."
      - "ctest --test-dir build --output-on-failure — 1/1 PASS (nsselection_handler_smoke)."
      - "nsselection_get_handle() 가 501 + application/problem+json body (type, title, status 501, detail) 반환 (Phase 1 stub, cJSON encoding 부재)."
      - "src/nssf/generated/api/NSSelectionGet.h 가 빈 헤더 + NSSF_GENERATED_BOUNDARY_STUB marker 보유 — WI-codegen-bootstrap 진입 시 generator output 으로 교체 + marker 제거 의무."
      - "4 arch module dir (selection_engine, availability_engine, subscription_store, notification_dispatcher) 은 본 WI 에서 미생성 — Phase 3 feature wave 의 후속 WI 가 생성."
      - "spec_reread_audit 가 비어있음 — specs/29.531 의 OpenAPI / docx 를 semantic decision 목적으로 재독하지 않음 (501 body 는 contract-derived 가 아니라 명시적 placeholder)."
    tests:
      - "tests/nssf/unit/test_nsselection_handler.c — Unity 2.6.0 5 assertion (returns 501, body contains status 501, body contains problem type, body contains Phase 1 tracer-bullet stub detail, NULL body does not crash)"
    verification_commands:
      - "cmake -S . -B build -G Unix Makefiles -DCMAKE_BUILD_TYPE=Debug"
      - "cmake --build build --parallel"
      - "ctest --test-dir build --output-on-failure"
      - "sudo apt-get install -y cmake build-essential  # CI prerequisite"

  # ===== Phase 1 wave 1 (NSSelectionGet full feature wiring, PR G) =====
  # PR #92 merged — wave 1 첫 WI. NSSAIAvailability spec emit + 14 schema
  # full coverage 는 PR-codegen-nssaiavailability-extension follow-up.
  - id: WI-codegen-bootstrap
    owner_lane: code
    depends_on:
      - WI-tracer-bullet-toolchain
    inputs:
      - engineering/nssf/engineering-design.md (schema_codegen slot freeze)
      - handoff/nssf/contract.yaml (api topics + data-model topics)
      - specs/29.531/TS29531_Nnssf_NSSelection.yaml (generator input only, drift/trace source per spec-to-design-coverage)
      - "specs/29.531/TS29531_Nnssf_NSSAIAvailability.yaml (generator input only — emit 는 follow-up PR)"
    expected_files:
      - infra/nssf/codegen/openapi-generator-cli.config.yaml
      - infra/nssf/codegen/vendor/cJSON/ (pinned reference, v1.7.18 — runtime link 은 generator-emitted src/nssf/generated/external/cJSON 사용. dual version 정책은 type-overrides.yaml cjson_runtime_policy 참조.)
      - "src/nssf/generated/model/*.{h,c} (PR #92 emit = 32 schemas — NSSelection-only. 14 contract schemas 중 7 emitted + 4 deferred to PR-codegen-nssaiavailability-extension + 3 wrapper_expected. TS29571 transitive ~25 informational.)"
      - src/nssf/generated/include/{list,binary,keyValuePair}.h (generator utility headers)
      - src/nssf/generated/external/{cJSON.h,cJSON.c,cJSON.licence} (generator pinned cJSON, runtime link target)
      - src/nssf/generated/CMakeLists.txt (nssf_generated STATIC lib)
      - CMakeLists.txt (root, add_subdirectory(src/nssf/generated))
      - infra/nssf/codegen/regenerate.sh (deterministic regen + --check)
      - design/scripts/verify-generated-models.py (3-way classification oracle)
      - infra/nssf/codegen/type-overrides.yaml (wrapper plan + multi-spec strategy)
    acceptance:
      - "PR #92 emit = NSSelection-only spec emit. 14 contract schema 중 7 emitted (AuthorizedNetworkSliceInfo, SliceInfoForRegistration/PDUSession/UEConfigurationUpdate, Snssai, PlmnId, Tai). 4 NSSAIAvailability-source schema (NssaiAvailabilityInfo, AuthorizedNssaiAvailabilityInfo, NssfEventSubscriptionCreate/CreatedData) 는 deferred — follow-up PR (PR-codegen-nssaiavailability-extension) 에서 emit. 3 wrapper_expected (NfInstanceId, SupportedFeatures, PatchDocument) 는 type-overrides.yaml 분류."
      - generated header 가 data-model-implementation-map.md 의 target path/c_type_hint 와 일치 (path = src/nssf/generated/model/, c_type = <snake_case>_t).
      - cmake configure + build 가 nssf_generated target 으로 PASS.
      - "regenerate.sh --check — drift 없음 (deterministic emit)."
      - "verify-generated-models.py — expected_present=7, expected_missing=0, wrapper_expected_missing=3 classified, deferred_missing=4 classified."
    tests:
      - "tests/nssf/unit/test_generated_smoke.c — Unity 4 assertions (snssai_create+convertToJSON+free, snssai_parseFromJSON, plmn_id round-trip, cJSON vendored sanity)"
    verification_commands:
      - cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Debug
      - cmake --build build --parallel
      - ctest --test-dir build --output-on-failure -R generated_smoke
      - bash infra/nssf/codegen/regenerate.sh --check
      - python3 design/scripts/verify-generated-models.py nssf

  - id: WI-schema-bootstrap
    owner_lane: code
    depends_on:
      - WI-codegen-bootstrap
    inputs:
      - design/nssf/architecture/state-persistence.md (PostgreSQL/libpq backend 결정, table-as-queue strategy)
      - design/nssf/module-decomposition/SubscriptionStore.md
      - design/nssf/module-decomposition/AvailabilityEngine.md
    expected_files:
      - infra/nssf/schema.sql (PostgreSQL bootstrap — availability, subscription, retry_queue tables)
      - infra/nssf/schema_README.md (운영자 적용 가이드)
    acceptance:
      - schema.sql 이 availability/subscription/retry_queue 3 table 을 생성 (core columns + JSONB filter/payload).
      - retry_queue 는 FOR UPDATE SKIP LOCKED 패턴을 위한 index 보유.
      - operator-provided DSN 으로 idempotent 재실행 가능 (CREATE TABLE IF NOT EXISTS).
    tests:
      - tests/nssf/integration/test_schema_bootstrap.c — psql -f schema.sql 후 3 table 존재 + index 검증
    verification_commands:
      - psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -f infra/nssf/schema.sql
      - ctest --test-dir build -R nssf_schema_bootstrap

  - id: WI-tls-bootstrap
    owner_lane: code
    depends_on:
      - WI-codegen-bootstrap
    inputs:
      - docs/adr/ADR-0004-project-security-baseline.md (7 항목 baseline)
      - engineering/nssf/engineering-design.md (tls_security, oauth2_token_validation, sbi_client_stack slot)
      - design/nssf/architecture/runtime-model.md (TLS context lifecycle, JWKS cache)
    expected_files:
      - src/nssf/runtime/tls_context.{h,c} (app_library mTLS context, peer cert verify)
      - src/nssf/runtime/oauth2_jwks.{h,c} (libjwt JWKS fetch + cache)
      - src/nssf/runtime/oauth2_scope_check.{h,c} (per-op scope 검증)
      - src/nssf/runtime/CMakeLists.txt
    acceptance:
      - TLS context 가 ADR-0004 mode=enabled 일 때 mTLS handshake 수행 (mocked peer cert).
      - JWKS cache 가 operator-provided endpoint 로부터 key set 을 fetch + TTL cache.
      - scope_check 가 `nnssf-nsselection` / `nnssf-nssaiavailability` 두 scope 정확 매칭.
    tests:
      - tests/nssf/unit/test_tls_context_handshake.c — mocked peer cert 로 handshake PASS/FAIL
      - tests/nssf/unit/test_oauth2_scope_check.c — scope 매칭 PASS, mismatched scope FAIL (401/403)
      - tests/nssf/integration/test_jwks_fetch.c — mock JWKS server fixture
    verification_commands:
      - ctest --test-dir build -R nssf_tls_
      - ctest --test-dir build -R nssf_oauth2_

  # backlog WI — amendment 2026-06-01 (operator 결정, Pane-2 review of PR #115).
  # ADR-0004 M4 (outbound OAuth2) 를 WI-tls-bootstrap (inbound M3) 에서 분리.
  # pr-slicing-plan PR-phase2-outbound-oauth2 의 work_item source.
  - id: WI-outbound-oauth2
    owner_lane: code
    depends_on:
      - WI-tls-bootstrap
      - WI-nsselection-handler   # phase-order gate (amendment 2026-06-01, operator) — pr-slicing PR-phase2-outbound-oauth2 와 일관. M4 를 phase1_wave1 tail 뒤로 정렬.
    inputs:
      - docs/adr/ADR-0004-project-security-baseline.md (M4 outbound token attach)
      - engineering/nssf/engineering-design.md (sbi_client_stack, oauth2 outbound slot)
      - design/nssf/architecture/runtime-model.md (outbound OAuth2 token cache lifecycle)
    expected_files:
      - src/nssf/runtime/oauth2_outbound.{h,c} (NRF token endpoint client_credentials acquire + TTL token cache + outbound bearer attach)
      - src/nssf/runtime/CMakeLists.txt (link nssf_runtime — libcurl + libjwt)
    acceptance:
      - NRF token endpoint 로부터 client_credentials grant 로 access token 취득 + TTL cache.
      - outbound peer NF / NRF 호출에 Authorization Bearer 부착 (M4 code path 존재).
      - token TTL 만료 시 자동 refresh (lazy acquire).
    tests:
      - tests/nssf/unit/test_oauth2_outbound_attach.c — bearer 부착 + TTL refresh 경계
      - tests/nssf/integration/test_nrf_token_acquire.c — mock NRF token endpoint fixture
    verification_commands:
      - ctest --test-dir build -R nssf_oauth2_outbound

  - id: WI-problem-details-wrapper
    owner_lane: code
    depends_on:
      - WI-codegen-bootstrap
    inputs:
      - design/nssf/contract/error-handling.md (operation × cause matrix)
      - design/nssf/architecture/error-propagation.md
      - handoff/nssf/contract.yaml (error topics 18종)
    expected_files:
      - src/nssf/wrappers/nf_problem_details_wrapper.{h,c}
    acceptance:
      - status-code 별 factory (`nf_problem_details_make_400` 등 17 status + default = 18 cause type) 가 모든 NSSF operation 의 ProblemDetails response 를 생성.
      - mandatory header (Retry-After, Location, WWW-Authenticate, Allow) 가 status-code 별 자동 부착.
      - cJSON serializer 가 RFC 7807 + 3GPP cause/instance 필드를 emit.
    tests:
      - tests/nssf/unit/test_problem_details_factory.c — 17 status + default = 18 cause type round-trip
      - tests/nssf/unit/test_problem_details_headers.c — mandatory header 검증
    verification_commands:
      - ctest --test-dir build -R nssf_problem_details_

  - id: WI-nftype-wrapper
    owner_lane: code
    depends_on:
      - WI-codegen-bootstrap
    inputs:
      - design/nssf/contract/data-model/NFType.json (complexity_flags=['anyOf'])
      - open-gaps-and-assumptions.md G-09 (forward-compat passthrough policy)
    expected_files:
      - src/nssf/wrappers/nf_type_wrapper.{h,c}
    acceptance:
      - NFType wrapper 가 3GPP enum probe 후 unknown 값을 passthrough + log warn (G-09 정책).
      - generated struct 와 wrapper 사이 변환이 lossless.
    tests:
      - tests/nssf/unit/test_nftype_wrapper.c — known enum + unknown string + null/empty
    verification_commands:
      - ctest --test-dir build -R nssf_nftype_

  - id: WI-availability-repo
    owner_lane: code
    depends_on:
