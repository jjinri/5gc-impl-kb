    expected_files:
      - src/nssf/repository/availability_repository.{h,c}
      - src/nssf/repository/CMakeLists.txt
    acceptance:
      - "`AvailabilityRepository::find_for_plmn_tai()` — read-only, libpq SELECT (NSSelectionGet 가 사용)."
      - "`AvailabilityRepository::upsert()` — libpq UPSERT in transaction (Phase 2 가 사용)."
      - "`AvailabilityRepository::patch()` / `delete()` — Phase 2 가 사용."
      - in-memory mock 변형 1종 — unit/module-integration 용도.
    tests:
      - tests/nssf/unit/test_availability_repo_inmemory.c — find/upsert/patch/delete round-trip (mock)
      - tests/nssf/integration/test_availability_repo_pg.c — PostgreSQL fixture 로 round-trip
    verification_commands:
      - ctest --test-dir build -R nssf_availability_repo_

  - id: WI-selection-engine
    owner_lane: code
    depends_on:
      - WI-availability-repo
      - WI-codegen-bootstrap
      - WI-nftype-wrapper
    inputs:
      - design/nssf/module-decomposition/SelectionEngine.md
      - design/nssf/architecture/request-flow.md (NSSelectionGet flow)
      - api-implementation-matrix.md (NSSelectionGet row)
      - open-gaps-and-assumptions.md G-07 (operator-provided redirect target)
    expected_files:
      - src/nssf/engine/selection_engine.{h,c}
      - src/nssf/engine/CMakeLists.txt
    acceptance:
      - "`SelectionEngine::select()` 가 SliceInfoForRegistration / SliceInfoForPDUSession / SliceInfoForUEConfigurationUpdate 3 query payload 처리."
      - business-rule — allowed/requested Snssai disjoint check, DNN + S-NSSAI match, PLMN/Tai filtering.
      - operator-provided redirect table 참조 (G-07) — config 부재 시 redirect 결정하지 않음.
    tests:
