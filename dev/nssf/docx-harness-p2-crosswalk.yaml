# Output 5: plan-amendment recommendation only; pr-slicing-plan.yaml intentionally unchanged.
plan_amendment_recommendation:
  required_now: true
  direct_plan_file_changed_by_this_pr: false
  recommended_registration: >-
    Register this PR as the DOCX-HARNESS-PHASE-2 gate evidence, then amend Phase4
    contract/security/e2e acceptance rows to consume the matrix above. Do not add
    a new runtime implementation slice before Phase4 unless a Phase4 test row is
    declared must-pass and currently impossible.
  new_slice_needed_before_phase4: false
  absorb_into_existing_phase4:
    - PR-phase4-contract-tests
    - PR-phase4-security-tests
    - PR-phase4-e2e-tests
  defer_to_phase5:
    - PR-phase5-operator-configuration-guide
  possible_future_slices_after_phase4_findings:
    - subscription_patch_semantic_hardening_if_event_filter_mutation_is_confirmed
    - nsselection_procedure_variant_expansion_if unsupported markers are not acceptable
    - notification_feature_payload_support_if NSRP/NSIUN/validity notifications are required
