    - DOCX-GAP-002: empty taiList requires ONSSAI support or explicit unsupported response
    - DOCX-GAP-004: NSSelection registration/PDU/UE-config existing subset matrix
    - DOCX-GAP-004: PDN/OtherPurpose/InterPLMN rows as supported-or-deferred markers
