; NSSF Runtime Config — Example
;
; 본 파일은 NSSF 바이너리 startup 시 읽는 config 의 *예시*. 실 운영 시
; operator 가 secret / DSN / cert path 를 본 example 위에 갱신한다.
;
; Schema source — dev/nssf/conf/nssf-config.schema.yaml
; Secret class policy — 동일 yaml 의 secret_classes 섹션 참조.
;
; Phase 1 wave 0 (PR #87) 의 501 stub 는 config 가 필요 없음. 본 파일은
; Phase 1 wave 1 진입 시점 (WI-tls-bootstrap 부터) 실제 영향.

[nssf]
nf_instance_id = 00000000-0000-0000-0000-000000000000  ; placeholder — operator 가 실 UUID 주입
nf_set_id = nssf-set-region-a                          ; optional, redundancy 시 사용

[server]
listen_address = 0.0.0.0
listen_port = 8443
max_concurrent_streams = 100

[tls]
enabled = true
server_cert_path = /etc/nssf/tls/server.crt           ; operator 책임
server_key_path = /etc/nssf/tls/server.key            ; operator 책임 (chmod 0600)
client_ca_path = /etc/nssf/tls/ca-bundle.crt          ; operator 책임 — mTLS peer cert verify
min_version = TLSv1.3
; cipher_suites = (미명시 시 OpenSSL secure defaults)

[oauth2]
jwks_url = https://example.operator.5gc/nrf/jwks      ; operator 주입
jwks_cache_ttl_seconds = 3600
scopes = nnssf-nsselection,nnssf-nssaiavailability

[db]
dsn = postgresql://nssf@db.example.operator.5gc:5432/nssf?sslmode=verify-full
                                                       ; password 는 PGPASSFILE 또는 별도 file 권고
max_connections = 10
connect_timeout_seconds = 10
ssl_mode = verify-full

[cache]
availability_ttl_seconds = 60
subscription_ttl_seconds = 300

[redirect]
; config_path = /etc/nssf/redirect.yaml                ; G-07 — 부재 시 redirect 안 함

[log]
level = INFO
config_path = /etc/nssf/zlog.conf
; redaction_enabled = true                             ; default true (Phase 5 정책)

[metric]
; endpoint = http://metrics.example.operator.5gc:9090  ; 미명시 시 metric off

[trace]
sampler_kind = parentbased_traceidratio
sampler_ratio = 0.1
