  # ─── P5 — NotificationDispatcher ───────────────────────────────────────────
  - id: nssf-notify-dispatcher
    title: NotificationDispatcher outbound POST + correlation + retry
    type: implementation-planning
    status: planned
    owner: dev
    depends_on:
      - nssf-availability-engine
      - nssf-subscription-store
      - nssf-observability
      - nssf-repo-subscription
    trace_to:
      - design/nssf/module-decomposition/NotificationDispatcher.md
      - design/nssf/architecture/configuration-strategy.md
      - design/nssf/architecture/error-propagation.md
    acceptance:
      - correlation-id 가 outbound `3gpp-Sbi-Correlation-Info` header 와 W3C traceparent 양쪽 전파.
      - outbound TLS / mTLS code path 가 *production-capable* 으로 존재 (ADR-0004 의무 1·2). `tls.enabled` / `mtls.enabled` config 가 enable/disable.
      - "outbound OAuth2 client credentials / token attach code path 가 *production-capable* 으로 존재 (ADR-0004 의무 4). token cache miss → NRF (또는 별도 authz server) token endpoint 호출 → cache → `Authorization: Bearer <token>` 부착. `oauth2_outbound.enabled` config 가 enable/disable."
      - retry default — max_attempts=10, initial=1s, cap=60s exponential backoff (engineering-design 결정).
      - retry queue persist = `nssf_notification_retry_queue` (PostgreSQL, FOR UPDATE SKIP LOCKED row-lock dequeue). subscription 변경 + enqueue 1 트랜잭션 (at-least-once 보장).
      - 4xx → no retry. 5xx / timeout / connection error / outbound TLS handshake fail / OAuth2 token endpoint 5xx → retry. OAuth2 client_secret invalid → 즉시 dead-letter + alert. max 초과 → dead-letter (log + metric).
      - ordering 보장 없음 (callback receiver idempotent 가정).

