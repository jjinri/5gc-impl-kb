  - id: nssf-transport-server
    title: SBI inbound HTTP/2 + TLS + mTLS + inbound OAuth2 production-capable transport 골격
    type: implementation-planning
    status: planned
    owner: dev
    depends_on: []
    trace_to:
      - design/nssf/architecture/runtime-model.md
      - design/nssf/architecture/configuration-strategy.md
      - design/nssf/architecture/request-flow.md
      - handoff/nssf/contract.yaml
      - docs/adr/ADR-0004-project-security-baseline.md
      - engineering/nssf/engineering-design.md
    acceptance:
      - HTTP/2 server = nghttp2 (engineering-design 결정). prior-knowledge + ALPN h2 ingress 양쪽 지원.
      - inbound TLS code path 가 *production-capable* 으로 존재 (ADR-0004 의무 1). cert/key/CA load via library context (start-up), `tls.enabled` config 가 enable/disable. dev disable 가능, production-capable path 항상 존재.
      - inbound mTLS code path 가 *production-capable* 으로 존재 (ADR-0004 의무 2). client cert chain + peer identity verification, `mtls.enabled` + `mtls.client_cert_required` config.
      - inbound OAuth2 bearer validation code path 가 *production-capable* 으로 존재 (ADR-0004 의무 3). JWKS fetch + signature/expiry/audience/scope 검증 via third-party JWT library, `oauth2_inbound.enabled` config.
      - 3gpp-Sbi-Correlation-Info / 3gpp-Sbi-Producer-Id 등 헤더가 inbound context 에 도달.
      - TLS/JWT primitive 직접 구현 금지 (ADR-0004 의무 6) — maintained third-party library 만 사용.
    notes:
      - 라이브러리 후보 비교는 engineering-design.md `sbi_server_stack` (server lib, 현 ratify 완료 = nghttp2) / `tls_security` (TLS lib, PR4 재-ratify 예정) / `oauth2_token_validation` (inbound OAuth2 lib, PR4 재-ratify 예정) slot 의 책임. 본 task 는 결정된 library 를 적용 — TLS / inbound OAuth2 lib 는 PR4 merge 전까지 ADR-0004 baseline + architecture target 으로 인식, codegen 은 PR4 eng_frozen 재통과 후 진입.

