# ─── Factory function naming ──────────────────────────────────────────
factory_naming_convention: |
  WI-problem-details-wrapper 가 emit 할 factory function 명명 규칙.
  - nf_problem_details_make_<status_code>() — status code 1차 dispatch.
  - nf_problem_details_make_<status_code>_<cause_short>() — 같은 status code
    의 cause variant 가 2+ 일 때 (예 401 의 token_missing vs token_invalid).
  - 모든 factory 가 cJSON 으로 RFC 7807 body emit + mandatory header 자동 부착.

