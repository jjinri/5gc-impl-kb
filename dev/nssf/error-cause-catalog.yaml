# NSSF Error Cause Catalog — 18 cause type
#
# 본 yaml 은 NSSF 의 모든 HTTP error response 의 *RFC 7807 ProblemDetails*
# 와 *3GPP cause type* 의 단일 카탈로그. WI-problem-details-wrapper
# (Phase 1 wave 1) 가 본 카탈로그를 입력으로 factory function emit.
#
# 18 cause = source verification-plan.md / contract error-handling 의
# operation × cause matrix 의 unique cause set.
