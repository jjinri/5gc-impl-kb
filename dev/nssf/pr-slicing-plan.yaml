      ── scope amendment 2026-06-08 (resume #10, OPTION 1, operator+Pane2(codex)+orchestrator 수렴) ──
      dead-letter REPRESENTATION = 명시적 `status` enum column (pending / dead_letter) on
      retry_queue. attempt_count>=max encoding 채택 안 함 — terminal state 암묵화로
      audit/replay/observability/phase4 검증 약화, max_attempts 정책 변경 시 과거 terminal
      row 의미 흔들림. status column 이 fail-closed 도 구조적으로 안전 — claim query =
      `status='pending' AND next_attempt_at <= now` 이면 dead_letter row 는 구조적
      unclaimable (attempt_count ceiling 은 WHERE 누락/reset 버그 취약). 그래서 scope_files
      += infra/nssf/schema.sql + infra/nssf/migrations/manifest.yaml (persistence contract).
      G-08 재확인: 본 slice 는 CALL-DRIVEN — NO worker/polling loop/thread/timer/sleep.
      dispatch_pending 이 *호출 시* due (status='pending' AND next_attempt_at<=now) row 1개만
      claim/attempt/schedule/dead-letter. retriable(5xx/timeout/429/conn/TLS) → attempt_count++
      + next_attempt_at = now + backoff + jitter (re-arm). max 초과 OR terminal(4xx / OAuth2
      NSSF_OAUTH2_ABORT/FORBIDDEN) → status=dead_letter (terminal, no further claim). fail-closed
      (unauth outbound 절대 금지). 본 amendment = ratified design (engineering-design +
      6/5 G-08 checkpoint, 둘 다 status column 명시) 의 transcription/scope-fix — design
