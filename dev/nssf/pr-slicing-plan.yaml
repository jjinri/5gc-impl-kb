  - '#90 merged — execution-control drift validator + CI gate.'
  - '#91 merged — Phase 1 wave 1 dependency prep + apt sanity probe.'
  - '#92 merged — WI-codegen-bootstrap (openapi-generator + cJSON vendoring).'
  - '#97 merged — Phase 1 wave 1 P0 wrapper prep.'
  - '#98 merged — WI-problem-details-wrapper + codegen gap follow-up.'
  - '#99 merged — WI-nftype-wrapper.'
  - '#100 merged — handoff doc 2026-05-29.'
  - '#101 merged — WI-schema-bootstrap (PostgreSQL bootstrap).'
  - '#103 merged — autonomous-runner PR-A 정책 freeze (ADR-0005 + plan + CONTEXT glossary).'
  - '#104 merged — autonomous-runner PR-B 인프라 (5 agent + slice picker + security drift + retro CI).'
  - '#105 merged — autonomous-runner PR-C runner skill rewrite + plan-amendment template.'
  - '#106 merged — autonomous-runner PR-D NSSF first dry-run evidence + wave1 status sync.'
  - '#110 merged — PR-codegen-nssaiavailability-extension (first fully-autonomous orchestrator slice, ADR-0005 4-condition self-merge gate). multi-spec emit, model 32→50.'

