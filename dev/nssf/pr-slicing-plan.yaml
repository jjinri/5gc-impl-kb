# NSSF PR Slicing Plan — autonomous implementation PR 단위 분할
#
# 본 파일은 codegen-work-items.yaml 의 WI graph 를 *PR 단위 chunk* 로 분할한
# 초안. 각 PR 의 scope_files / depends_on / required_checks 를 명시해
# autonomous agent 가 PR 사이클을 결정론으로 진행 가능하게 한다.
#
# 본 파일은 *초안* — 후속 PR 진행 시 lessons 반영 필요 (예 PR 크기 조정,
# 분할 추가, 결정 pass 삽입).
schema_version: pr-slicing-plan-v1
nf: nssf
stage: implementation-planning
source_codegen_work_items: dev/nssf/codegen-work-items.yaml
source_agent_execution_plan: dev/nssf/agent-execution-plan.yaml
source_verification_matrix: dev/nssf/verification-matrix.yaml
generated_date: 2026-05-27

# ─── 1. 정책 ──────────────────────────────────────────────────────────
policy:
  pr_size_target: '≤ 1500 LOC (vendored 제외) — review 가능 단위.'
  pr_size_hard_max: '≤ 5000 LOC — review fatigue 한계. 초과 시 분할 필수.'
  decision_pass_separate: |
    library/stack 채택·교체·dependency 추가 결정은 *별도 decision pass PR* 로
    분리. 코드 PR 과 결정 PR 섞지 않는다. 결정 PR 의 산출 = engineering-design
    + readiness-config + codegen-work-items + team-execution-plan 갱신.
  pr_chain_requirement: |
    각 PR 의 depends_on 은 *이미 머지된* 또는 *현재 open* PR 의 id 만 참조.
    cycle 금지.
  rollback_unit: |
    각 PR 은 *독립 revertible*. 머지 후 회귀 발견 시 revert 1건으로 정상화
    가능해야 함. cross-PR 의 implicit dependency 금지.

