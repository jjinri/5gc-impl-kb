# NSSF Generated Sources — Generation Manifest
#
# 본 yaml 은 src/<nf>/generated/ 안 *어떤 파일이 어떤 source 로부터 생성되는가*
# 의 단일 진실 출처. WI-codegen-bootstrap (Phase 1 wave 1) 진입 시 본 manifest
# 가 *드라이브 input* — openapi-generator 가 본 yaml 의 expected_artifacts 를
# emit 하고, drift-allowlist.yaml 이 예외 파일을 분류.
#
# Phase 1 wave 0 (PR #87) 시점에서는 generated/ 디렉터리 안에 *hand-written
# stub 1 개* (NSSelectionGet.h) 만 존재 + NSSF_GENERATED_BOUNDARY_STUB marker.
# 이 stub 은 WI-codegen-bootstrap 진입 시 generator output 으로 교체 + marker
# 제거 의무.
schema_version: generation-manifest-v1
nf: nssf
stage: implementation-planning
source_contract: handoff/nssf/contract.yaml
source_engineering_design: engineering/nssf/engineering-design.md
source_codegen_config: infra/nssf/codegen/openapi-generator-cli.config.yaml
source_drift_allowlist: infra/nssf/codegen/drift-allowlist.yaml
generated_date: 2026-05-27
generator_status: active  # WI-codegen-bootstrap (PR #15) 진입 후 active.

# ─── 1. Active generator pipeline (Phase 1 wave 1 — multi-spec) ───────
# WI-codegen-bootstrap 진입 — openapi-generator-cli 7.10.0 가 NSSF 2 spec
# (NSSelection + NSSAIAvailability) 를 각각 generate 후 model union merge.
# TS29571/TS29510 은 external $ref bundle. regenerate.sh 가 deterministic
# regen + union merge (공통 TS29571 schema 는 NSSelection run canonical).
# PR-codegen-nssaiavailability-extension 이 NSSAIAvailability emit 추가.
generator_pipeline:
  tool: openapi-generator-cli
  tool_version: 7.10.0
  regenerator_script: infra/nssf/codegen/regenerate.sh
  spec_inputs:
    - specs/29.531/TS29531_Nnssf_NSSelection.yaml         # primary input (pass 1)
    - specs/29.531/TS29531_Nnssf_NSSAIAvailability.yaml   # primary input (pass 2)
    - specs/29.571/TS29571_CommonData.yaml                # external $ref bundle
    - specs/29.510/TS29510_Nnrf_NFManagement.yaml         # external $ref bundle
  emit_targets:
    - src/nssf/generated/model/  (50 schemas — NSSelection + NSSAIAvailability + TS29571 transitive union)
    - src/nssf/generated/include/  (list, binary, keyValuePair utility headers)
    - src/nssf/generated/external/  (cJSON 1.x, generator's pinned copy)

# ─── 2. Boundary stubs (PR #87 산출, PR #15 에서도 유지) ──────────────
# src/nssf/generated/api/NSSelectionGet.h 는 PR #87 의 handwritten stub.
# 본 PR (#15) 은 generator 의 api/ (HTTP client) 를 commit 하지 않음 — NSSF
# runtime 은 nghttp2 server + handwritten transport handler 사용. 따라서
# boundary stub 의 NSSF_GENERATED_BOUNDARY_STUB marker 는 *유지* — wrapper
# 본체 PR (PR-phase1-wave1-nsselection-handler) 까지 잔존.
phase1_wave0_stubs:
  - path: src/nssf/generated/api/NSSelectionGet.h
    kind: handwritten_stub
    marker: 'NSSF_GENERATED_BOUNDARY_STUB'
    replace_during: PR-phase1-wave1-nsselection-handler
    rationale: 'Phase 1 wave 0 tracer-bullet 의 generator boundary 표현. NSSF runtime 이 generator api/ 를 link 안 하므로 본 PR (#15) 에서도 미교체. wrapper PR 진입 시 실 handler 로 교체.'

# ─── 2. Phase 1 wave 1 (WI-codegen-bootstrap) 예상 산출 ───────────────
# openapi-generator(C) + cJSON serializer 가 emit 할 model schema.
# contract 의 14 data-model + TS29571 외부 dependency.
expected_artifacts:
  contract_data_models:
    - AuthorizedNetworkSliceInfo
    - AuthorizedNssaiAvailabilityInfo
    - NfInstanceId
    - NssaiAvailabilityInfo
    - NssfEventSubscriptionCreateData
    - NssfEventSubscriptionCreatedData
    - PatchDocument
    - PlmnId
    - SliceInfoForPDUSession
    - SliceInfoForRegistration
    - SliceInfoForUEConfigurationUpdate
    - Snssai
    - SupportedFeatures
    - Tai
  external_ts29571_dependencies:
    - PatchItem
    # 정확한 TS29571 외부 dependency count 는 WI-codegen-bootstrap 시점에 build 산출이 확정.

  emit_pattern:
    headers: 'src/nssf/generated/model/<snake_case>.h'
    sources: 'src/nssf/generated/model/<snake_case>.c'
    serializer_kind: 'cJSON (generator emitted at src/nssf/generated/external/, runtime link target. infra/nssf/codegen/vendor/cJSON/ 는 ratified reference. cjson_policy 참조.)'
    naming_convention: 'PascalCase schema name → snake_case file name + snake_case_t struct type. nf_ prefix 없음. 예: AuthorizedNetworkSliceInfo → authorized_network_slice_info.{h,c} + authorized_network_slice_info_t.'

  build_target: nssf_generated
  build_kind: STATIC
  cmake_path: src/nssf/generated/CMakeLists.txt

# ─── 3. Generator config reference ────────────────────────────────────
generator_config:
  package: openapi-generator
  language_target: c
  version_pin_required: true
  config_file: infra/nssf/codegen/openapi-generator-cli.config.yaml
  inputs:
    - specs/29.531/TS29531_Nnssf_NSSelection.yaml
    - specs/29.531/TS29531_Nnssf_NSSAIAvailability.yaml
  generator_only_mode: true
  notes: |
    generator-only mode = agent 가 의미 해석 안 함. spec_reread_audit 의
    allowed 카테고리 (generator_input).

# ─── 4. Drift gate ────────────────────────────────────────────────────
drift_gate:
  enabled: true                # PR #92 부터 active. regenerate.sh --check 동작.
  ci_enforced: false           # CI 미포함 (JRE 30MB download 비용). local 실행. ci_enforced 활성화는 future PR.
  check_command: 'bash infra/nssf/codegen/regenerate.sh --check'
  oracle_command: 'python3 design/scripts/verify-generated-models.py nssf'
  pass_criteria_drift: 'regenerate.sh --check exit 0 (committed src/nssf/generated/ ↔ generator output byte-level identical)'
  pass_criteria_oracle: 'verify-generated-models.py expected_missing=0 (wrapper_expected + deferred 는 PASS classified)'
  allowlist_source: infra/nssf/codegen/drift-allowlist.yaml
  notes: |
    PR #92 (WI-codegen-bootstrap) 머지 후 drift gate active.
    - regenerate.sh --check 가 deterministic emit 보장.
    - verify-generated-models.py 가 3-way classification 보장.
    - api/NSSelectionGet.h handwritten stub 는 allowlist entry 로 유지
      (NSSF runtime 이 generator api/ 를 link 안 하므로). PR-phase1-wave1-
      nsselection-handler 진입 시 실 handler 로 교체 + allowlist entry 제거.
