# Project Security Baseline — TLS / mTLS / OAuth2 production-capable mandate.
#
# Extracted from docs/adr/ADR-0004-project-security-baseline.md without
# behavior change. 본 baseline 은 *모든 NF 의 codegen 산출* 이 따라야 할 의무
# source 다.

schema_version: policies-v1
policy_id: security-baseline
rationale_source:
  - docs/adr/ADR-0004-project-security-baseline.md

# 7 mandatory items (ADR-0004 §Baseline 7 항목).
baseline_mandates:

  - id: M1
    name: internal_https_tls_code_path
    requirement: >-
      NF 바이너리는 TLS-capable HTTP/2 stack 을 *내부에* 보유한다.
      외부 sidecar 의존 단일값으로 close 금지.
    applies_to: all_nfs
    verification:
      kind: security
      test_id_prefix: t-tls-*

  - id: M2
    name: mtls_code_path
    requirement: >-
      server/client certificate, CA bundle, peer verification 을 NF 가
      *수행할 수 있는* code path 가 존재한다.
    applies_to: all_nfs
    verification:
      kind: security
      test_id_prefix: t-mtls-*

  - id: M3
    name: inbound_oauth2_bearer_validation_code_path
    requirement: >-
      NF 가 inbound access token 을 *검증할 수 있는* code path 가 존재한다.
    applies_to: all_nfs
    verification:
      kind: security
      test_id_prefix: t-oauth2-inbound-*

  - id: M4
    name: outbound_oauth2_token_attach_code_path
    requirement: >-
      NF 가 outbound 호출에 access token 을 *부착할 수 있는* code path 가
      존재한다 (NRF token endpoint 호출 + peer NF 호출 양쪽).
    applies_to: all_nfs
    verification:
      kind: security
      test_id_prefix: t-oauth2-outbound-*

  - id: M5
    name: dev_disable_with_production_path_present
    requirement: >-
      M1~M4 의 capability 는 config 로 enable/disable 할 수 있으나,
      *production-capable code path 자체는 항상 존재* 한다. dev profile 에서
      disable 했다는 이유로 production code path 를 누락 금지.
    applies_to: all_nfs
    verification:
      kind: security
      test_id_prefix: "(test-matrix kind=security 종합)"

  - id: M6
    name: third_party_library_mandate
    requirement: >-
      TLS / X.509 / JWT / JWS / OAuth2 primitive 는 NF 가 *직접 구현하지
      않는다*. maintained library 선택 (예 OpenSSL/BoringSSL/mbedTLS, libcurl,
      libjwt, jansson). 후보 비교는 NF 별 engineering-design.md 의
      `sbi_server_stack`/`sbi_client_stack`/관련 slot 에서 수행.
    applies_to: all_nfs
    verification:
      kind: code review
      test_id_prefix: "—"

  - id: M7
    name: profile_spec_depth_externalized
    requirement: >-
      33.310 (certificate enrollment, CMPv2 등) / 33.210 (cipher suite
      profile, IPsec 등) 수준의 세부 — *operator-provided compliant
      cert/config + library compliance assumption* 으로 처리한다. NF 는
      cipher suite / TLS version / profile 별 검증을 *직접 결정* 하지
      않고, *operator/library default + config policy* 로 설정 가능하게
      둔다. compliance 는 library + operator-provided config 책임.
    applies_to: all_nfs
    verification:
      kind: operator/library 외부 처리
      test_id_prefix: "—"

# NF-specific security role (baseline 외 추가 가능).
nf_specific_role:
  allowed: true
  weakening_prohibited: true
  examples:
    - NRF = OAuth2 token issuer / authorization server
    - SCP/SEPP = mediation + peer auth gateway
    - AMF = NAS security context manager
  registration_location:
    - engineering/<nf>/engineering-design.md
    - docs/adr/ADR-*.md (NF-specific)
  notes: >-
    추가된 role 은 baseline 항목을 *약화* 할 수 없다. 강화·세부화만 가능.

# 의무 source for codegen agent.
codegen_required_sources:
  - docs/adr/ADR-0004-project-security-baseline.md
  - engineering/<nf>/engineering-design.md
  - design/<nf>/architecture/
  - dev/<nf>/

# Rejected alternatives (ADR-0004 §Considered options) — reference only.
rejected_alternatives:
  - id: R1
    name: in_scope_security_spec_dependency
    statement: >-
      33.501 in-scope dependency 추가 (NF spec lifecycle 확장) — rejected.
      contract 가 33.501 본문 어휘를 hidden default 로 주입해 traceability
      흐려짐. chain 으로 비대.
  - id: R2
    name: engineering_design_only_no_project_adr
    statement: >-
      engineering-design.md amendment 만, project ADR 없음 — rejected.
      NF 별 산출 분산 → 다음 NF 작성 시 재발견 비용·일관성 위험.
  - id: R3
    name: tls_oauth_primitive_self_impl
    statement: >-
      TLS/OAuth primitive 직접 구현 허용 (FIPS 등) — rejected (의무 6).
      scope 폭발, library 가 이미 standard-compliant.
  - id: R4
    name: production_capable_optional
    statement: >-
      production-capable path 를 *선택적* 으로 — rejected (의무 5).
      dev profile 에서 production code 없이 출시될 위험.
