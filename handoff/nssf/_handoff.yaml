service_scenarios:
- id: nnssf_nsselection_get
  title: Nnssf_NSSelection — Get
  description: '본 서비스의 단일 operation 은 `GET /network-slice-information` 이다. docx §5.2.2.2
    는 5 개의 사용 시나리오를 명시한다.


    1. **Registration / mobility 절차에서 슬라이스 선택 정보 조회** (§5.2.2.2.2). AMF 가 GET 으로 *Allowed
    NSSAI, Configured NSSAI, target AMF set / candidate AMF list, target AMF Service
    Set, Target NSSAI* 를 받아 등록·재배치를 수행한다. 호출 컨텍스트는 TS 23.502 §4.2.2.2.2 (Registration),
    §4.2.2.2.3 (Registration with AMF re-allocation), §4.11.1.2.2 (EPS↔5GS handover
    via N26), §4.11.1.3.x / §4.23.12 (EPS↔5GS mobility registration), §4.9.1 / §4.23.7
    / §4.23.11 (Xn/N2 handover with PLMN change).

    2. **PDU Session Establishment 시 슬라이스 선택** (§5.2.2.2.3). AMF (또는 다른 PLMN 의 NSSF)
    가 S-NSSAI · roaming indication · HPLMN S-NSSAI 매핑을 query 로 보내고, NSSF 는 NRF URI
    + 선택적 NSI ID 를 응답. TS 23.502 §4.3.2.2.3.2 / §4.3.2.2.3.3.

    3. **UE Configuration Update 시 슬라이스 정보 조회** (§5.2.2.2.4). TS 23.502 §4.2.4.2.

    4. **PDN Connection Establishment (EPC interworking) 시 매핑 조회** (§5.2.2.2.5). SMF+PGW-C
    가 VPLMN-HPLMN S-NSSAI 매핑을 받는다. `RSIPCE` feature 필요. TS 23.502 §4.11.0a.5.

    5. **NWDAF 의 슬라이스 부하 분석 등을 위한 NSI ID 조회** (§5.2.2.2.6). `SIOP` feature 필요. TS
    23.288 §6.3.4.


    stage 2 절차의 본문 (TS 23.502) 은 `specs/23.502/` 에 등록되어 있으나, NSSF 본 페이지에서는 *호출 진입·결과
    메시지* 까지만 다룬다 — Registration 등 23.502 절차의 단계별 상세는 23.502 페이지가 진실 출처다 *(23.502 페이지
    미생성 — 추후 architecture/ 카테고리에서 보강)*.'
  mermaid:
  - "sequenceDiagram\n    autonumber\n    participant AMF\n    participant NSSF\n\
    \    Note over AMF,NSSF: TS 29.531 §5.2.2.2.2 — Registration / mobility procedure\n\
    \    AMF->>NSSF: GET /nnssf-nsselection/v2/network-slice-information<br/>?nf-type=AMF&nf-id={uuid}<br/>&slice-info-request-for-registration={SliceInfoForRegistration}<br/>&home-plmn-id={PlmnId}&tai={Tai}&supported-features={hex}\n\
    \    alt NSSF finds authorized slice info\n        NSSF-->>AMF: 200 OK<br/>AuthorizedNetworkSliceInfo<br/>(allowedNssaiList\
    \ + targetAmfSet|candidateAmfList<br/>+ optional targetNssai, nsagInfos, mappingOfNssai)\n\
    \    else No slice instance found\n        NSSF-->>AMF: 403 Forbidden<br/>ProblemDetails(cause=SNSSAI_NOT_SUPPORTED)\n\
    \    end"
  - "sequenceDiagram\n    autonumber\n    participant Consumer as AMF / V-NSSF\n \
    \   participant NSSF\n    Note over Consumer,NSSF: TS 29.531 §5.2.2.2.3 — PDU\
    \ Session Establishment\n    Consumer->>NSSF: GET /nnssf-nsselection/v2/network-slice-information<br/>?nf-type={NFType}&nf-id={uuid}<br/>&slice-info-request-for-pdu-session={SliceInfoForPDUSession}<br/>(+\
    \ home-plmn-id, tai for serving-PLMN NSSF)\n    alt NSSF resolves NRF for the\
    \ slice instance\n        NSSF-->>Consumer: 200 OK<br/>AuthorizedNetworkSliceInfo<br/>(nsiInformation.nrfId\
    \ [+ nsiId])\n    else\n        NSSF-->>Consumer: 403 Forbidden<br/>ProblemDetails(cause=SNSSAI_NOT_SUPPORTED)\n\
    \    end"
  participants:
  - AMF
  - AMF / V-NSSF
  - NSSF
- id: nnssf_nssaiavailability_update
  title: Nnssf_NSSAIAvailability — Update
  description: AMF 가 자신이 TA 단위로 지원하는 S-NSSAI 집합을 NSSF 에 등록·갱신한다 (§5.3.2.2). PUT 은
    *대체 (replace)*, PATCH 는 *부분 수정*. 응답은 NSSF 가 인가한 결과 (`AuthorizedNssaiAvailabilityInfo`).
    인가 결과가 비면 `204 No Content`, 비지 않으면 `200 OK`.
  mermaid:
  - "sequenceDiagram\n    autonumber\n    participant AMF\n    participant NSSF\n\
    \    Note over AMF,NSSF: TS 29.531 §5.3.2.2 — Update NSSAI availability\n    alt\
    \ Replace\n        AMF->>NSSF: PUT /nnssf-nssaiavailability/v1/nssai-availability/{nfId}<br/>NssaiAvailabilityInfo\n\
    \    else Partial update\n        AMF->>NSSF: PATCH /nnssf-nssaiavailability/v1/nssai-availability/{nfId}<br/>application/json-patch+json:\
    \ PatchDocument\n    end\n    alt Authorized result non-empty\n        NSSF-->>AMF:\
    \ 200 OK<br/>AuthorizedNssaiAvailabilityInfo\n    else Authorized result empty\n\
    \        NSSF-->>AMF: 204 No Content\n    else Unauthorized / unsupported S-NSSAI\n\
    \        NSSF-->>AMF: 403 Forbidden<br/>ProblemDetails(cause=NOT_AUTHORIZED|SNSSAI_NOT_SUPPORTED)\n\
    \    end"
  participants:
  - AMF
  - NSSF
- id: nnssf_nssaiavailability_subscribe_notify
  title: Nnssf_NSSAIAvailability — Subscribe + Notify
  description: NF 소비자 (AMF, V-NSSF) 가 NSSAI 가용성·Slice Replacement·Slice Instance Replacement·NSSAI
    유효시간 변경 이벤트를 구독한다 (§5.3.2.3.1). 이벤트 발생 시 NSSF 는 callback URI 로 통지한다 (§5.3.2.5.1).
    `SUMOD` feature 가 있으면 PATCH 로 구독을 변경할 수 있다 (§5.3.2.3.2). DELETE 로 해지 (§5.3.2.4.1).
  mermaid:
  - "sequenceDiagram\n    autonumber\n    participant Consumer as AMF / V-NSSF\n \
    \   participant NSSF\n    Note over Consumer,NSSF: TS 29.531 §5.3.2.3 / §5.3.2.5\
    \ — Subscribe + Notify\n    Consumer->>NSSF: POST /nnssf-nssaiavailability/v1/nssai-availability/subscriptions<br/>NssfEventSubscriptionCreateData<br/>(nfNssaiAvailabilityUri,\
    \ event[, additionalEvents], expiry?, amfSetId?, ...)\n    NSSF-->>Consumer: 201\
    \ Created<br/>Location: .../subscriptions/{subscriptionId}<br/>NssfEventSubscriptionCreatedData\n\
    \    Note over NSSF,Consumer: Later — event triggers (e.g. NSSAI status change,\
    \ NSRP, NSIUN, validity-time change)\n    NSSF->>Consumer: POST {nfNssaiAvailabilityUri}<br/>NssfEventNotification<br/>(subscriptionId,\
    \ authorizedNssaiAvailabilityData?,<br/>altNssai?, unavailableNsiList?, nssaiValidityTimeInfoList?)\n\
    \    alt Notification accepted\n        Consumer-->>NSSF: 204 No Content\n   \
    \ else Callback context lost\n        Consumer-->>NSSF: 400 Bad Request<br/>ProblemDetails(cause=RESOURCE_CONTEXT_NOT_FOUND<br/>or\
    \ RESOURCE_URI_STRUCTURE_NOT_FOUND)\n    end\n    Note over Consumer,NSSF: Termination\n\
    \    Consumer->>NSSF: DELETE /nnssf-nssaiavailability/v1/nssai-availability/subscriptions/{subscriptionId}\n\
    \    NSSF-->>Consumer: 204 No Content"
  participants:
  - AMF / V-NSSF
  - NSSF
cross_nf:
- 상대 NF: AMF
  방향: AMF → NSSF
  트리거: Registration / handover / UE CU 시 NSSelection GET; TA-단위 supported S-NSSAI
    등록 NSSAIAvailability PUT/PATCH/DELETE; 가용성 변경 구독 POST /subscriptions
  출처: docx §5.2.2.2.2, §5.3.2.2, §5.3.2.3.1
- 상대 NF: AMF
  방향: NSSF → AMF
  트리거: NSSAI 가용성·NSRP·NSIUN·validity-time 변경 callback (POST `{nfNssaiAvailabilityUri}`
    → NssfEventNotification)
  출처: docx §5.3.2.5.1
- 상대 NF: SMF / SMF+PGW-C
  방향: SMF → NSSF
  트리거: SMF 선택 (5GC 비/로밍·HR), PDN Connection Establishment (EPC interworking, RSIPCE
    feature) 시 NSSelection GET
  출처: docx §5.2.2.1·§5.2.2.2.3·§5.2.2.2.5
- 상대 NF: V-NSSF
  방향: V-NSSF ↔ NSSF (HPLMN 의 H-NSSF)
  트리거: 로밍 시 V-NSSF 가 H-NSSF 에 NSSelection GET / 구독 cascade. Network Slice Replacement
    도 V-NSSF 가 H-NSSF 의 통지를 받아 AMF 에 cascade
  출처: docx §5.2.1·§5.3.1·§5.3.2.5.1
- 상대 NF: NWDAF
  방향: NWDAF → NSSF
  트리거: '슬라이스 부하 분석 시 NSI ID 조회 NSSelection GET (`SIOP` feature). cross-NF 카테고리 — manifest
    deps `cross-nf: 23.288 (NWDAF)`'
  출처: docx §5.2.2.2.6, manifest
- 상대 NF: NRF
  방향: NSSF → NRF
  트리거: OAuth2 token 발급 (Access Token Request, TS 29.510 §5.4.2.2). NSSF 자체가 target
    AMF set 등을 결정할 때 NRF discovery 사용 가능
  출처: docx §5.2.2.2.2 본문, §6.x.9
- 상대 NF: NG-RAN
  방향: (out of scope)
  트리거: NSSF 는 NG-RAN 과 직접 SBI 호출 없음 — AMF 가 NGAP REROUTE NAS REQUEST (TS 38.413 §8.6.5)
    로 매개. manifest 의 38.413 은 `manual_overrides.exclude`
  출처: docx §5.2.2.2.2, manifest
- 상대 NF: 33.501 (security)
  방향: optional
  트리거: OAuth2 / TLS 의 정의 출처. 본 KB 의 NSSF 구현 범위에서는 manifest exclude — 본 페이지는 §6.x.9
    명시 한도까지만 다룸
  출처: manifest
configuration:
  supportedfeatures_nnssf_nsselection_docx_table_6_1_8_1:
    title: supportedFeatures — Nnssf_NSSelection (docx Table 6.1.8-1)
    items:
    - '#': '1'
      Feature: '`ES3XX`'
      M/O: M
      설명: Extended Support of HTTP 307/308 redirection. NSSelection 의 모든 service operation
        에서 307/308 redirect 처리를 강제 (Rel-15 한정 동작 → Rel-16+ 전구간).
    - '#': '2'
      Feature: '`TargetNssai`'
      M/O: O
      설명: Target NSSAI 처리 (TS 23.501 §5.3.4.3.3, §5.15.5.2.1).
    - '#': '3'
      Feature: '`RSIPCE`'
      M/O: O
      설명: Retrieval of Slice Information during PDN Connection Establishment. SMF+PGW-C
        가 EPC interworking 의 PDN Connection Establishment 시 매핑 조회 (TS 23.502 §4.11.0a.5).
    - '#': '4'
      Feature: '`SIOP`'
      M/O: O
      설명: Slice Information for Other Purpose. NWDAF 의 슬라이스 부하 분석 등 (TS 23.288 §6.3.4).
  supportedfeatures_nnssf_nssaiavailability_docx_table_6_2_8_1:
    title: supportedFeatures — Nnssf_NSSAIAvailability (docx Table 6.2.8-1)
    items:
    - '#': '1'
      Feature: '`ONSSAI`'
      M/O: O
      설명: Optimized NSSAI Availability Data encoding — TAI list/range, RestrictedSnssai
        의 PLMN list, event 구독의 TAI range list 등을 압축 표현.
    - '#': '2'
      Feature: '`SUMOD`'
      M/O: O
      설명: Subscription Modification — 기존 subscription 을 PATCH 로 수정.
    - '#': '3'
      Feature: '`EANAN`'
      M/O: O
      설명: Empty Authorized NSSAI Availability Notification — 인가된 데이터가 *전 TA 모두* 비었을
        때 빈 배열 통지를 허용.
    - '#': '4'
      Feature: '`ES3XX`'
      M/O: M
      설명: NSSelection 과 동일 — 307/308 강제.
    - '#': '5'
      Feature: '`SATAS`'
      M/O: O
      설명: Subscribe ALL TAIs for AMF Set — AMF set 전체 TAI 를 한 번에 구독.
    - '#': '6'
      Feature: '`NSIUN`'
      M/O: O
      설명: Network Slice Instance Unavailability Notification — NSI 가용성 통지 (TS 23.501
        §5.15.5.3).
    - '#': '7'
      Feature: '`NSRP`'
      M/O: O
      설명: Network Slice Replacement (TS 23.501 §5.15.19) — S-NSSAI 가 unavailable 이
        되면 alternative S-NSSAI 통지.
  resource_overview:
    title: Resource overview
    items: []
  defaults_timeouts_expiry:
    title: Defaults / timeouts / expiry
    items: []
error_handling:
  http_codes:
  - '200'
  - '201'
  - '204'
  - '307'
  - '308'
  - '400'
  - '401'
  - '403'
  - '404'
  - '405'
  - '406'
  - '411'
  - '413'
  - '414'
  - '415'
  - '429'
  - '500'
  - '501'
  - '502'
  - '503'
  - default
  tables:
    Common HTTP responses (yaml paths):
    - HTTP code: '`200 OK`'
      의미: 정상 응답 본문 포함
      권장 복구: —
    - HTTP code: '`201 Created`'
      의미: subscription 생성 성공. `Location` 헤더로 자원 URI 반환
      권장 복구: 클라이언트는 Location 을 저장
    - HTTP code: '`204 No Content`'
      의미: 정상 처리, 본문 없음 (DELETE 또는 인가 결과 빈 PUT/PATCH 결과)
      권장 복구: —
    - HTTP code: '`307 Temporary Redirect` / `308 Permanent Redirect`'
      의미: NSSF set 의 다른 인스턴스로 재라우팅. `Location` + `3gpp-Sbi-Target-Nf-Id`
      권장 복구: '`ES3XX` feature 보유 시 자동 재요청. 308 은 캐시 가능'
    - HTTP code: '`400 Bad Request`'
      의미: 요청 문법/필수 IE 결손
      권장 복구: 요청 재구성 후 재시도 금지 (4xx 는 client 책임)
    - HTTP code: '`401 Unauthorized`'
      의미: OAuth2 token 부재·만료
      권장 복구: NRF 의 Access Token Request 로 재발급 후 재시도
    - HTTP code: '`403 Forbidden`'
      의미: 인가 거부 — 아래 application error 참조
      권장 복구: cause 별 분기
    - HTTP code: '`404 Not Found`'
      의미: 자원 없음 — 아래 application error 참조
      권장 복구: cause 별 분기
    - HTTP code: '`405 Method Not Allowed`'
      의미: OPTIONS 외 method 가 store 자원에 사용됨
      권장 복구: method 수정
    - HTTP code: '`406 Not Acceptable`'
      의미: Accept 헤더 불일치
      권장 복구: '`application/json` 으로 재시도'
    - HTTP code: '`411 Length Required`'
      의미: '`Content-Length` 부재'
      권장 복구: 헤더 추가
    - HTTP code: '`413 Payload Too Large`'
      의미: 본문 과대
      권장 복구: 분할·요약
    - HTTP code: '`414 URI Too Long`'
      의미: URI 과대
      권장 복구: query 분리 또는 본문 transfer 검토
    - HTTP code: '`415 Unsupported Media Type`'
      의미: content type 불일치 (e.g. PATCH 가 `application/json-patch+json` 아님)
      권장 복구: content type 정정
    - HTTP code: '`429 Too Many Requests`'
      의미: rate limit
      권장 복구: 백오프 후 재시도
    - HTTP code: '`500 Internal Server Error`'
      의미: NSSF 내부 오류
      권장 복구: 재시도 (지수 백오프). 로그 수집
    - HTTP code: '`501 Not Implemented`'
      의미: NSSF 미지원 (e.g. POST 의 `UNSUPPORTED_EVENT_TYPE`)
      권장 복구: feature 협상 결과 점검
    - HTTP code: '`502 Bad Gateway`'
      의미: upstream 오류 (e.g. SCP 경유)
      권장 복구: 재시도
    - HTTP code: '`503 Service Unavailable`'
      의미: 일시 불가
      권장 복구: '`Retry-After` 따라 재시도'
    - HTTP code: '`default`'
      의미: 위에 안 잡히는 예외
      권장 복구: yaml 미정의 — 4xx 처럼 처리
    Application Errors — Nnssf_NSSelection (docx Table 6.1.7.3-1):
    - HTTP: '`403`'
      ProblemDetails cause: '`SNSSAI_NOT_SUPPORTED`'
      의미: 요청한 슬라이스 선택 정보가 미지원 S-NSSAI 에 대한 것
      권장 복구: UE 의 Configured/Subscribed NSSAI 재조회. 잘못된 S-NSSAI 제거 후 재시도 금지
    - HTTP: '`403`'
      ProblemDetails cause: '`NOT_AUTHORIZED`'
      의미: NF 서비스 소비자가 슬라이스 선택 정보를 받을 권한이 없음
      권장 복구: OAuth2 token / NF 등록 상태 확인. operator policy 점검
    Application Errors — Nnssf_NSSAIAvailability (docx Table 6.2.7.3-1):
    - HTTP: '`400`'
      ProblemDetails cause: '`RESOURCE_CONTEXT_NOT_FOUND`'
      의미: NSSF 의 통지가 존재하는 callback URI 로 도달했으나 NF 소비자 측 컨텍스트는 없음
      권장 복구: 소비자가 구독을 재생성. NSSF 는 stale subscription 정리
    - HTTP: '`403`'
      ProblemDetails cause: '`SNSSAI_NOT_SUPPORTED`'
      의미: 요청 S-NSSAI 가 PLMN 에서 미지원
      권장 복구: S-NSSAI 집합 재구성
    - HTTP: '`403`'
      ProblemDetails cause: '`NOT_AUTHORIZED`'
      의미: 가용성 갱신·구독 권한 없음
      권장 복구: OAuth2 token / NF profile 확인
    - HTTP: '`404`'
      ProblemDetails cause: '`RESOURCE_NOT_FOUND`'
      의미: '`nfId` 자원이 NSSF 에 없음 (가용성 갱신·삭제 시)'
      권장 복구: 먼저 PUT 으로 자원 생성
    - HTTP: '`404`'
      ProblemDetails cause: '`SUBSCRIPTION_NOT_FOUND`'
      의미: PATCH/DELETE 대상 subscription 부재
      권장 복구: subscriptionId 재확인. 필요 시 재생성
    - HTTP: '`404`'
      ProblemDetails cause: '`RESOURCE_URI_STRUCTURE_NOT_FOUND`'
      의미: 통지가 NF 소비자 측 미등록 callback URI 로 도달
      권장 복구: NSSF 가 stale URI 정리
    - HTTP: '`501`'
      ProblemDetails cause: '`UNSUPPORTED_EVENT_TYPE`'
      의미: 구독 생성 시 어떤 event 도 NSSF 가 지원하지 않음
      권장 복구: feature negotiation 재확인. 지원 event 만 요청
